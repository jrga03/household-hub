version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # All @radix-ui/* must move together: mixed versions split
      # react-dismissable-layer and break pointer events in dialogs (CLAUDE.md).
      radix:
        patterns: ["@radix-ui/*"]
        update-types: [major, minor, patch]
      minor-and-patch:
        update-types: [minor, patch]
      # One PR per week for majors, so CI runs once (parallel e2e jobs hit
      # Docker Hub's pull rate limit) and the bumps are tested together.
      majors:
        update-types: [major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
