name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - run: npm ci
      - name: Lint
        run: npm run lint -- --max-warnings=0

  # Dead code and dependency hygiene (roadmap 4.10); stale ignores fail too.
  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - run: npm ci
      - name: Knip
        run: npm run knip

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - run: npm ci
      - name: Typecheck app
        run: npx tsc --noEmit -p tsconfig.json
      # tests/ and the Playwright config are outside the app program.
      - name: Typecheck tests
        run: npx tsc --noEmit -p tsconfig.tests.json

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - run: npm ci
      - name: Unit tests
        run: npx vitest run --allowOnly=false

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://dummy.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJkdW1teSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNjQwOTk1MjAwLCJleHAiOjE5NTY1NzEyMDB9.dummy' }}
      # Initial-bundle budget (review UI-03/Theme 7).
      - name: Bundle size budget
        run: npm run size

  # Schema contract (roadmap 4.1): db lint, pgTAP RLS suite, and generated
  # types drift. The CLI is pinned so gen types output matches the committed file.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Start Postgres
        run: supabase db start
      - name: Lint database functions
        run: supabase db lint --fail-on error
      - name: pgTAP
        run: supabase test db
      - name: Generated types are current
        run: |
          npm run gen:types
          git diff --exit-code src/types/database.types.ts

  # Chromium smoke against a local Supabase stack, on every push and PR.
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Start Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,analytics,vector
      - name: Export local Supabase credentials
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Install Chromium system dependencies
        timeout-minutes: 6
        run: npx playwright install-deps chromium
      - name: Install Chromium
        timeout-minutes: 6
        run: npx playwright install chromium
      - name: Smoke tests
        run: npm run test:e2e:smoke
        env:
          PW_TEST_HTML_REPORT_OPEN: never
      - name: Upload smoke report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: [lint, knip, typecheck, unit-tests, build]
    if: github.event_name == 'push'
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - name: Check for E2E credentials
        id: check-creds
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "has_credentials=false" >> "$GITHUB_OUTPUT"
            echo "Skipping E2E tests: missing one or more Supabase secrets"
          else
            echo "has_credentials=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Checkout code
        if: steps.check-creds.outputs.has_credentials == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.check-creds.outputs.has_credentials == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        if: steps.check-creds.outputs.has_credentials == 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.check-creds.outputs.has_credentials == 'true'
        run: npx playwright install --with-deps

      - name: Run E2E tests
        if: steps.check-creds.outputs.has_credentials == 'true'
        run: npm run test:e2e
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Upload test results
        if: failure() && steps.check-creds.outputs.has_credentials == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
